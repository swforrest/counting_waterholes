# Waterhole surface-state segmentation — single source of truth.
#
# Everything that a person might reasonably want to revise without touching code
# lives here: the class scheme, its colours and keybindings, thresholds, feature
# selection and CV settings. Loaded by wh_config.py.

config_version: 1


# --- paths ----------------------------------------------------------------
# All relative to the repository root. wh_config.py resolves them against the
# repo root (found from the module location), so notebooks work whether they are
# run from the repo root or from cookie-cutting/.
paths:
  tiles: cookie-cutting/images_tif_v2      # re-exported chips: UTM 53S, with n_obs
  tiles_legacy: cookie-cutting/images_tif  # original 2024-only EPSG:4326 export
  chips_png: cookie-cutting/images         # pre-rendered 3-panel labelling PNGs
  labels: cookie-cutting/labels            # hand-painted masks (tracked in git)
  alphaearth: cookie-cutting/AlphaEarth_tif  # annual 64-band embeddings, S2 grid
  derived: cookie-cutting/derived          # manifests, temporal caches, models
  predictions: cookie-cutting/predictions  # per-tile class + probability rasters


# --- what a tile is -------------------------------------------------------
tiles:
  # Band order as written by cookie-cutting_S2_download.ipynb. Position is
  # authoritative; the band descriptions in the file are checked against this
  # and a mismatch is an error, never a silent reorder.
  bands: [B1, B2, B3, B4, B5, B6, B7, B8, B8A, B9, B11, B12]
  obs_band: n_obs
  nodata: -9999

  # Asserted on read. Chips failing these are reported by the inventory rather
  # than quietly used.
  expected_crs: EPSG:32753
  expected_pixel_size_m: 10.0
  pixel_size_tolerance_m: 0.01

  # Surface reflectance, already divided by 10000 in the GEE export. Values
  # outside this range (ignoring nodata) mean the export convention changed.
  reflectance_min: 0.0
  reflectance_max: 1.6

  # Filename convention: <prefix>_S2_<site>_<lat>_<lon>_<YYYY-MM>.tif
  filename_prefix: 2024-06_mimal_test_S2


# --- waterhole bounding boxes ---------------------------------------------
# The labelme JSON that seeded the AOIs also carries each waterhole's rectangular
# extent. The AOIs were built by buffering each box CENTRE by 750 m, so a 1.5 km
# chip frequently catches neighbouring waterholes: 93 of 187 tiles contain more
# than one, up to 5. Composition fractions over a whole tile therefore mix several
# waterholes together. The box bounds each site to its own basin.
#
# Row order in the JSON IS the site id — verified against all 187 filenames with
# zero mismatches.
bounding_boxes:
  labelme_json: cookie-cutting/2024-06_mimal_test_S2.json
  reference_tif: cookie-cutting/2024-06_mimal_test_S2.tif
  reference_png: cookie-cutting/2024-06_mimal_test_S2.png

  # LabelMe stores corners in PNG pixel coordinates, which include the padding
  # added when the mosaic was tiled for YOLO. These recover the offset.
  tile_size: 416
  stride: 104

  # Added on EVERY side, so a 292 m box becomes 492 m across. Allows for the
  # waterhole being larger in the wet season than when it was drawn.
  #
  # At 100 m the buffered box covers a median 10% of a tile (p10 4%, p90 40%) and
  # 7 of 187 boxes overflow the tile and are clipped to it. Deliberately modest:
  # the mask must leave enough savanna matrix for the footprint z-scores, the
  # surrounding-vegetation pseudo-rule and the 9x9 context windows to work.
  buffer_m: 100


# --- class scheme ---------------------------------------------------------
# id 0 is always the ignore class: excluded from training and from every metric.
# Revise names, colours and keys freely; changing ids or adding classes should
# come with a bump to scheme_version so existing masks stay interpretable.
classes:
  scheme_version: 1
  definitions:
    - id: 0
      name: unlabelled
      colour: "#00000000"
      key: "0"
      ignore: true
      description: >
        Not labelled, or too mixed to call. Leave margin pixels here rather than
        forcing them into a class — at 10 m most basin edges are mixed pixels.
    - id: 1
      name: open_water
      colour: "#1f4ea1"
      key: "1"
      ignore: false
      description: Clear-ish open water, low turbidity, no emergent cover.
    - id: 2
      name: turbid_water
      colour: "#8c6d3f"
      key: "2"
      ignore: false
      description: Open water with suspended sediment; high visible reflectance.
    - id: 3
      name: aquatic_vegetation
      colour: "#2e8b57"
      key: "3"
      ignore: false
      description: >
        Emergent sedges, floating mats, melaleuca within the basin. Often sits
        over standing water, which is exactly why MNDWI cannot be trusted as a
        wetness proxy here.
    - id: 4
      name: mud
      colour: "#a0522d"
      key: "4"
      ignore: false
      description: Saturated soil and drawdown zone; wet but not ponded.
    - id: 5
      name: dry_bare
      colour: "#d9b382"
      key: "5"
      ignore: false
      description: Exposed basin floor and pugged margin; dry bare ground.
    - id: 6
      name: surrounding_vegetation
      colour: "#7f9f5a"
      key: "6"
      ignore: false
      description: Savanna matrix outside the basin.

  # Drawn over any class, never painted. Marks pixels the composite has no
  # observation for, so a gap can never be mistaken for a dark surface.
  nodata_display_colour: "#ff00ff"


# --- feature stack --------------------------------------------------------
features:
  # Raw reflectance bands carried into the feature table. B1 and B9 are 60 m
  # atmospheric bands resampled to 10 m and carry no surface information worth
  # having; excluded by default.
  reflectance_bands: [B2, B3, B4, B5, B6, B7, B8, B8A, B11, B12]

  indices:
    - mndwi      # (G - SWIR1) / (G + SWIR1)  — Xu
    - ndwi       # (G - NIR)   / (G + NIR)    — McFeeters
    - ndvi       # (NIR - R)   / (NIR + R)
    - ndti       # (R - G)     / (R + G)      — turbidity
    - awei_sh
    - awei_nsh
    - red_green_ratio
    # Added beyond the original spec: sedge-over-water separates from dry sedge
    # far better in SWIR than in any green-based water index, which is the exact
    # blind spot that makes MNDWI unreliable for these sites.
    - ndmi       # (NIR - SWIR1) / (NIR + SWIR1) — canopy/soil moisture
    - nd_rededge # (B8A - B5)    / (B8A + B5)

  # Whether the per-pixel clear-observation count is a TRAINING feature.
  #
  # Off. n_obs describes the observing system, not the ground. Wet-season months
  # have both fewer clear scenes and more water, so a classifier can learn "few
  # observations therefore wet" rather than reading the surface — and that would
  # transfer badly to a year with different cloud cover. Permutation importance
  # ranked it 2nd of 121 features, which is what that shortcut looks like.
  #
  # n_obs is still used where it belongs: weighting temporal statistics, gating
  # pseudo-labels, and filtering the labelling queue.
  include_n_obs: false

  # --- AlphaEarth annual embeddings ---------------------------------------
  # 64 learned dimensions per pixel summarising a year of multi-sensor
  # observation, downloaded onto exactly the Sentinel-2 grid so no resampling is
  # needed — interpolating a learned embedding produces a vector that
  # corresponds to no real surface, unlike interpolating reflectance.
  #
  # Static: one year (2025) applies to every month. Treat with caution — these
  # add 64 columns against an effective sample size of 16 labelled SITES, so
  # they will look strong in-fold and need the leave-one-site-out number to be
  # believed.
  use_alphaearth: false          # flip to true to include them
  alphaearth_year: 2025
  alphaearth_bands: all          # 'all', or a list like [A00, A17, A42]

  # Local context: mean and SD in square windows of these sizes.
  context_windows: [3, 9]
  context_indices: [mndwi, ndvi]

  temporal:
    # NDWI dropped: it is nearly collinear with MNDWI and adds 14 temporal
    # columns for almost no information. NDTI carries turbidity (the mud vs
    # turbid-water distinction) and NDMI responds to water UNDER a canopy, which
    # is the whole reason aquatic vegetation is the hard class here.
    indices: [mndwi, ndvi, ndti, ndmi]
    # Northern Australia monsoon. Wet-season stats are taken over these months
    # (of any year), dry-season over the complement.
    wet_season_months: [11, 12, 1, 2, 3, 4]
    dry_season_months: [5, 6, 7, 8, 9, 10]
    # Harmonic regression terms. Start with annual only: a semi-annual term adds
    # two more parameters, and the wet-season peak that constrains them falls in
    # the months worst affected by cloud. Set to 2 once several years are in.
    harmonic_orders: 1

    # Ablation switch for the whole harmonic block.
    #
    # The harmonic contributes 9 of the 14 temporal features per index (27 of 43
    # in total) but is the weakest performer measured so far: on site 025 the
    # harmonic amplitude separated basin from matrix at 2.5x, against 3.2x for
    # the model-free wet_max - dry_min. Waterholes fill sharply and drain slowly,
    # which is an asymmetric sawtooth, not a sinusoid.
    #
    # MEASURED, and the answer was no. Leave-one-site-out over 9 labelled sites,
    # gradient boosting, macro F1:
    #
    #   instantaneous_only    28 features   0.358
    #   all_features          93 features   0.433
    #   no_harmonic           61 features   0.489
    #   model_free_temporal   57 features   0.497   <- best
    #
    # The harmonic block actively HURTS: dropping its 32 columns gains 0.056, and
    # dropping the trend term as well gains a further 0.008. Waterholes fill
    # sharply and drain slowly; a sinusoid fits that badly, and 36 poorly-fitting
    # columns against an effective sample size of 9 sites is a lot of room to
    # overfit.
    #
    # HOW MUCH THE TEMPORAL BLOCK IS WORTH DEPENDS ON THE MODEL, and the first
    # reading of this overstated it. Same splits, logistic regression:
    #
    #                          gradient boosting    logistic regression
    #   instantaneous_only          0.358                 0.512
    #   with temporal               0.497                 0.540
    #   gain                       +0.140                +0.028
    #
    # Logistic regression on instantaneous features ALONE (0.512) beats gradient
    # boosting with everything (0.497). So most of the apparent +0.14 was the
    # temporal features compensating for the tree model overfitting 9 sites, not
    # new information. The temporal block still helps — +0.028 on the model that
    # actually generalises best — but it is a modest gain, not a transformative
    # one, and that verdict should be revisited once more sites are labelled.
    #
    # Note this turns the harmonic off as a CLASSIFIER INPUT only. trend_per_year
    # remains worth computing and reporting for the multi-year degradation
    # question — it just does not help decide what a pixel is this month.
    harmonic_enabled: false
    keep_trend_when_disabled: false
    # A pixel-month is excluded from every temporal statistic below this many
    # clear observations.
    #
    # Set to 1, not 2, on the evidence of the manifest: January and February
    # average 1.99 and 2.03 clear scenes per pixel, against 6.3 in August, and
    # 13.5% of all chips rest on fewer than 2 scenes on average. A hard cut at 2
    # would therefore discard roughly half the wet season — precisely the months
    # that set each pixel's wet-season maximum, which is the reference every
    # self-normalised feature is measured against. Thin months are instead
    # down-weighted by sqrt(n_obs) in observation_weights(), which degrades
    # gracefully rather than deleting the signal.
    min_obs_for_temporal: 1
    # Threshold for "months since this pixel last held water". Deliberately
    # conservative, and deliberately only ever used as a feature — never as a
    # label or a footprint criterion.
    water_threshold_mndwi: 0.0


# --- basin footprint ------------------------------------------------------
# One basin per site: the connected region containing the tile centre, which is
# where the AOI was seeded from the original bounding-box centre. Other basins
# in the same tile are excluded.
footprint:
  seed: tile_centre
  # The basin is where the SEASONAL AMPLITUDE of the index signal is anomalous
  # relative to the tile's own savanna matrix. Deliberately not a threshold on
  # max MNDWI: a sedge-choked waterhole never crosses one, and would get no
  # footprint at all.
  amplitude_indices: [mndwi, ndvi, ndti]
  # Robust z-score of amplitude against the tile's own median/MAD; a pixel is
  # candidate basin above this.
  amplitude_z_threshold: 2.0
  # Dry-season NDVI anomaly: vegetated basins stay green as the matrix browns
  # off, so this is the strongest single discriminator for the hard sites.
  dry_ndvi_anomaly_z: 1.5
  min_basin_pixels: 4
  # Morphological cleanup, then a buffer, both in pixels (10 m each).
  closing_radius_px: 1
  buffer_px: 3
  # Seed search radius: how far from the tile centre to look for a candidate
  # basin pixel before declaring the site unfootprintable.
  seed_search_radius_px: 15


# --- pseudo-labelling -----------------------------------------------------
# Cheap, high-confidence labels for the easy classes only, so hand-labelling
# effort goes to aquatic vegetation, wet mud and pugged margin. Always written
# with source: pseudo in the sidecar so they can be excluded at will.
pseudo_labels:
  # Recalibrated against the data. The original min_obs of 4 excluded exactly
  # the wet-season months where water exists — January and February average ~2
  # clear scenes — and yielded almost nothing. Sampling 120 wet-season tiles
  # across 12 sites:
  #
  #   mndwi>   n_obs>=   pixels   tiles   sites
  #    0.25       4          30       5       3    <- original settings
  #    0.25       2         107      14       4
  #    0.15       2         170      17       6    <- chosen
  #    0.00       1         227      21       6
  #
  # Note what this does and does not buy. Open water is genuinely rare at 10 m
  # in these waterholes, so the pixel count stays small whatever the threshold.
  # What it buys is SITE coverage: open_water goes from 2 hand-labelled sites to
  # 6, and site count is what grouped-by-site cross-validation actually counts.
  min_obs: 2
  open_water:
    mndwi_min: 0.15             # still far above typical land MNDWI (-0.4 to -0.6)
    ndvi_max: 0.10
    # Erosion is OFF. It was meant to drop mixed waterline pixels, but 39% of
    # the water patches here are only 1-2 pixels, so a single erosion pass
    # deleted 35% of the water and two sites entirely (7 sites -> 5).
    # The MNDWI threshold already does that job: a half-water pixel sits near 0,
    # well below 0.15.
    erode_px: 0
  surrounding_vegetation:
    outside_footprint_buffer_px: 20
    # Dry-season savanna NDVI runs ~0.30-0.45, so a fixed 0.45 would silently
    # yield nothing outside the wet season. Applied as a percentile of the
    # tile's own distribution instead, with this as a floor.
    ndvi_min: 0.35
    ndvi_percentile: 60
  # Per class, per tile. Surrounding vegetation is most of a 1.5 km chip, so
  # uncapped it yields ~5,000 pixels per tile — 469,000 across the labelled
  # sites, which would bury the 31,838 hand-labelled pixels the model actually
  # needs to learn from. The pseudo-labels are here for site coverage, not bulk.
  max_pixels_per_class_per_tile: 300


# --- training -------------------------------------------------------------
# MOVED. Training parameters now live in wh_train.TrainParams and are constructed
# explicitly in model_training.ipynb, where they are visible beside the thing they
# affect. Cross-validation strategy, fold count, class weighting, the model list
# and the random seed are all set there.
#
# Only what must AGREE across the whole pipeline stays in this file: the class
# scheme and the paths. A model trained under one class scheme and applied under
# another produces confident nonsense, so those cannot be per-notebook.


# --- prediction and aggregation ------------------------------------------
prediction:
  majority_filter_px: 3
  temporal_consistency:
    enabled: true
    # An isolated wet month between dry months, at low observation count, is far
    # more likely a compositing artefact than a rainfall event. Flag it; do not
    # silently rewrite it.
    flag_only: true
    low_obs_threshold: 2
  aggregation:
    # Composition fractions are computed within the basin footprint only, so the
    # denominator is stable through time.
    within_footprint: true
    min_mean_obs_for_good_flag: 3


# --- labelling tool -------------------------------------------------------
labelling:
  labeller_name: scott
  panels: [rgb, mndwi, ndvi, ndti, ndmi]   # last one is the configurable extra
  rgb:
    bands: [B4, B3, B2]
    max_reflectance: 0.30
    gamma: 0.85
  # Display ranges. Tight and fixed so the same site looks the same month to
  # month, which is what makes temporal comparison while labelling possible.
  display_ranges:
    mndwi: [-0.8, 0.6]
    ndvi: [-0.2, 0.9]
    ndti: [-0.4, 0.4]
    ndmi: [-0.6, 0.6]
    ndwi: [-0.8, 0.6]
  brush:
    initial_radius_px: 2
    min_radius_px: 0
    max_radius_px: 20
  undo_stack_depth: 200
  # Zoom applied when a tile opens, centred on the tile centre. The basin is a
  # small part of a 1.5 km chip, so opening fully zoomed out wastes time.
  initial_zoom_half_width_px: 40
  keys:
    next_month: "right"
    prev_month: "left"
    next_tile: "n"
    prev_tile: "p"
    skip_tile: "s"
    save: "ctrl+s"
    undo: "ctrl+z"
    redo: "ctrl+y"
    eraser: "e"
    brush_mode: "b"
    polygon_mode: "g"
    toggle_png: "v"
    toggle_labels: "h"
    toggle_footprint: "f"
    brush_smaller: "["
    brush_larger: "]"
    quit: "q"
