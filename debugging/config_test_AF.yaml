#-------------------
##Class definitions## -- REQUIRED, drives the entire pipeline (no class list is
# hardcoded in the Python code -- the number and names of classes here can be
# anything; add, remove, or rename freely for a different model).
#
# 'names' maps each YOLO class id to a class name. Requirements:
#   - Keys MUST be contiguous integers starting at 0 (0, 1, 2, ... N-1).
#   - Must be IDENTICAL (same names, same ids) to the 'names:' block in the
#     training config that produced 'weights:' above -- class ids are baked into
#     the trained model, not stored anywhere else, so this file must match that
#     one exactly.
names:
  0: Dry_WH
  1: WH_swamp
  2: WH_wet
  3: WH_sink
  4: U

# 'class_distance_cutoff_px' gives the pixel distance used to cluster nearby
# detections of the SAME class into a single waterhole.
#   - Keyed by class NAME (not id) -- must match a name from 'names:' above exactly.
#   - EVERY class listed in 'names:' must have a matching entry here; a class with
#     no entry will cause the pipeline to fail fast with an error naming the
#     missing class (there is no silent/default cutoff).
#   - Extra entries here that don't match any class in 'names:' are ignored (with
#     a warning) rather than causing an error -- useful when trimming a class set.
#   - Values are in pixels; tune per class based on how tightly clustered/
#     overlapping detections of that class tend to be.
class_distance_cutoff_px:
  Dry_WH: 120
  WH_swamp: 170
  WH_wet: 120
  WH_sink: 120
  U: 120

# The lat/long cutoff should be roughly related to the resolution of the images
# For 3m resolution, 10 pix is roughly 30m. At approx -27 deg lat, this is approx 0.0003 degrees.
STAT_DISTANCE_CUTOFF_LATLONG: 0.00025 
# MOVING_DISTANCE_CUTOFF_LATLONG: 0.0003 #same, removed as shouldn't be needed

COMPARE_DISTANCE_CUTOFF_PIX: 8

#Tasks to be performed but for now, I'm just putting all false and run manually. 
tasks:
  # These 4 are not required if have been done before (and above paths are absolute and exist)
  prepare: False # Prepare for labelling
  segment: False # Segment images/labels
  run_detection: False # Run the classifier
  backwards_annotation: False # Generate annotations from the classifier output

  analyse:
