#-------------------
##Class definitions## -- REQUIRED, drives the entire pipeline (no class list is
# hardcoded in the Python code -- the number and names of classes here can be
# anything; add, remove, or rename freely for a different model).
#
# 'names' maps each YOLO class id to a class name. Requirements:
#   - Keys MUST be contiguous integers starting at 0 (0, 1, 2, ... N-1).
#   - Must be IDENTICAL (same names, same ids) to the 'names:' block in the
#     training config that produced 'weights:' above -- class ids are baked into
#     the trained model, not stored anywhere else, so this file must match that
#     one exactly.
names:
  0: Dry_WH
  1: WH_swamp
  2: WH_wet
  3: WH_sink
  4: U

# 'OVERLAP_METRIC' defines HOW overlap between two boxes is measured. This is the
# knob to change if merging is not behaving well on your waterhole shapes.
#   iou   - intersection / union (default). Penalises a size mismatch, so a small
#           waterhole whose box sits inside a big irregular neighbour's box scores
#           LOW and is KEPT AS A SEPARATE waterhole. Right for round/elliptical
#           holes, and safe when a big odd-shaped hole can engulf a smaller one.
#   iomin - intersection / area of the SMALLER box. A box fully inside another
#           scores 1.0, so containment always merges. Only use this if the model
#           emits a tight box and a loose box for the SAME waterhole; be aware it
#           will also swallow a genuinely distinct small waterhole sitting inside
#           a bigger box.
# Both are strict about non-overlap: boxes that do not touch score 0 and never
# merge, however close their centres.
OVERLAP_METRIC: iou

# 'class_iou_threshold' is the Intersection over Union (IoU) above which two
# detections of the SAME class are treated as the same waterhole and merged.
# IoU = area of overlap / area of union, so it accounts for box size AND shape,
# unlike the centre-distance cutoff this replaces.
#   - Keyed by class NAME (not id) -- must match a name from 'names:' above exactly.
#   - Values are an IoU in the range 0-1. LOWER = more permissive (merges more
#     readily); HIGHER = stricter (boxes must overlap more to merge).
#   - Strict IoU: boxes that do not physically overlap score 0 and are never
#     merged, however close their centres are.
#   - EVERY class listed in 'names:' must have a matching entry here; a class with
#     no entry will cause the pipeline to fail fast with an error naming the
#     missing class (there is no silent/default threshold).
#   - Extra entries here that don't match any class in 'names:' are ignored (with
#     a warning) rather than causing an error -- useful when trimming a class set.
#
# NOTE: 0.5 is the conventional starting point and these values still need
# tuning on your data. There is no direct conversion from the old pixel cutoffs,
# so the previous per-class tuning did NOT carry over -- in particular WH_swamp
# used to be the most permissive class (170px vs 120px), so you may want a lower
# threshold for it here.
class_iou_threshold:
  Dry_WH: 0.5
  WH_swamp: 0.5
  WH_wet: 0.5
  WH_sink: 0.5
  U: 0.5

# The lat/long cutoff should be roughly related to the resolution of the images
# For 3m resolution, 10 pix is roughly 30m. At approx -27 deg lat, this is approx 0.0003 degrees.
STAT_DISTANCE_CUTOFF_LATLONG: 0.00025 
# MOVING_DISTANCE_CUTOFF_LATLONG: 0.0003 #same, removed as shouldn't be needed

#Minimum IoU (0-1) for a detection to be counted as matching a ground-truth
#label. Matching is greedy and one-to-one: each detection pairs with at most one
#label (highest IoU first), so unmatched detections are false positives and
#unmatched labels are false negatives. 0.5 is the conventional value.
COMPARE_IOU_THRESHOLD: 0.5

